name: Deploy to GCE

on:
  push:
    branches: [main]

env:
  REGION: asia-northeast1
  IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/oi-alert-bot/bot
  INSTANCE_NAME: oi-alert-bot

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to GCE
        run: |
          gcloud compute ssh ${{ env.INSTANCE_NAME }} \
            --zone=${{ secrets.GCE_INSTANCE_ZONE }} \
            --command="
              docker-credential-gcr configure-docker --registries=${{ env.REGION }}-docker.pkg.dev 2>/dev/null
              docker pull ${{ env.IMAGE }}:latest
              docker stop oi-alert-bot 2>/dev/null || true
              docker rm oi-alert-bot 2>/dev/null || true
              docker run -d \
                --name oi-alert-bot \
                --restart unless-stopped \
                --env-file ~/oi-alert-bot/.env \
                -v oi-alert-data:/app/data \
                ${{ env.IMAGE }}:latest
              docker image prune -f
            "
